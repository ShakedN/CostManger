<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Cost</title>
</head>
<body>
<h1>Add a new cost</h1>
<form method="post" action="http://localhost:3000/api/costs">
    <br/>description: <input type="text" name="description" required />
    <br/>category: <input type="text" name="category" required />
    <br/>user_id: <input type="number" name="user_id" required />
    <br/>sum: <input type="number" name="sum" required />
    <br/>date: <input type="date" name="date" />
    <br/><input type="submit" />
</form>
</body>
</html>
